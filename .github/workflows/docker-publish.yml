name: Build and Push Docker Image

on:
  # 允许手动触发工作流
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (latest or beta)'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - beta

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v7
      
      # 2. 设置 Docker Buildx（用于构建镜像）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      # 3. 登录到 DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      # 4. 构建并推送 Docker 镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: yunshenwuji/scriptgrid:${{ github.event.inputs.tag }}
          cache-from: type=registry,ref=yunshenwuji/scriptgrid:buildcache
          cache-to: type=registry,ref=yunshenwuji/scriptgrid:buildcache,mode=max
      
      # 5. 显示构建结果
      - name: Image built and pushed
        run: |
          echo "✅ Docker image successfully built and pushed!"
          echo "📦 Image: yunshenwuji/scriptgrid:${{ github.event.inputs.tag }}"
